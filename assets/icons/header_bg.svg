<svg viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="goldOuter" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#DEB86A" />
            <stop offset="50%" stop-color="#FDF1B8" />
            <stop offset="100%" stop-color="#C2923A" />
        </linearGradient>
        <linearGradient id="goldInner" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#B28230" />
            <stop offset="50%" stop-color="#E8CE83" />
            <stop offset="100%" stop-color="#936817" />
        </linearGradient>
        
        <!-- High-Quality Interlocking Geometric & Floral Background Pattern -->
        <pattern id="islamic-motif" x="0" y="-10" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
            <!-- Base warm parchment -->
            <rect width="100" height="100" fill="#F9F6EE" />
            <!-- Soft backing geometry -->
            <path d="M50 0 L60 20 L80 10 L70 30 L90 40 L70 50 L90 60 L70 70 L80 90 L60 80 L50 100 L40 80 L20 90 L30 70 L10 60 L30 50 L10 40 L30 30 L20 10 L40 20 Z" fill="#EFE8D6" stroke="#DACCB4" stroke-width="1.5"/>
            <!-- Prominent Star -->
            <path d="M50 15 L55 35 L75 25 L65 40 L85 50 L65 60 L75 75 L55 65 L50 85 L45 65 L25 75 L35 60 L15 50 L35 40 L25 25 L45 35 Z" fill="#FDFCF9" stroke="#C5A880" stroke-width="1"/>
            <!-- Central interlacing squares and gem -->
            <rect x="40" y="40" width="20" height="20" fill="none" stroke="url(#goldOuter)" stroke-width="1.5" transform="rotate(45 50 50)" />
            <rect x="40" y="40" width="20" height="20" fill="none" stroke="url(#goldOuter)" stroke-width="1.5" />
            <!-- Subtle floral curves -->
            <path d="M50 30 Q55 20 60 20 Q55 30 55 35 Z" fill="#E6D3B6"/>
            <path d="M70 50 Q80 45 80 40 Q70 45 65 45 Z" fill="#E6D3B6"/>
            <path d="M50 70 Q45 80 40 80 Q45 70 45 65 Z" fill="#E6D3B6"/>
            <path d="M30 50 Q20 55 20 60 Q30 55 35 55 Z" fill="#E6D3B6"/>
            <!-- Floral center -->
            <circle cx="50" cy="50" r="4" fill="#007A33" />
            
            <!-- Connection web lines -->
            <path d="M100 0 L0 100" fill="none" stroke="#DACCB4" stroke-width="0.5" stroke-dasharray="2,2"/>
            <path d="M0 0 L100 100" fill="none" stroke="#DACCB4" stroke-width="0.5" stroke-dasharray="2,2"/>
            <path d="M50 0 L50 100" fill="none" stroke="#DACCB4" stroke-width="0.5"/>
            <path d="M0 50 L100 50" fill="none" stroke="#DACCB4" stroke-width="0.5"/>
        </pattern>

        <linearGradient id="cartoucheFill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="90%" stop-color="#FAF7F2" />
            <stop offset="100%" stop-color="#EBE3D3" />
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A2C1A" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Base intricate background -->
    <rect x="0" y="0" width="1200" height="80" fill="url(#islamic-motif)" />

    <!-- Solid borders top and bottom to frame the view neatly -->
    <rect x="0" y="2" width="1200" height="76" fill="none" stroke="#4A2C1A" stroke-width="2"/>
    <rect x="0" y="6" width="1200" height="68" fill="none" stroke="url(#goldInner)" stroke-width="3"/>
    <rect x="0" y="11" width="1200" height="58" fill="none" stroke="#4A2C1A" stroke-width="1.5" stroke-dasharray="5 2"/>

    <!-- LEFT SURAH CARTOUCHE -->
    <!-- Double layered background with rich borders and points facing inwards -->
    <path d="M 0 16 L 400 16 Q 420 16 430 40 Q 420 64 400 64 L 0 64 Z" fill="url(#cartoucheFill)" stroke="#4A2C1A" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M 0 21 L 396 21 Q 410 21 418 40 Q 410 59 396 59 L 0 59 Z" fill="none" stroke="url(#goldOuter)" stroke-width="3"/>
    <path d="M 0 25 L 390 25 Q 400 25 405 40 Q 400 55 390 55 L 0 55 Z" fill="none" stroke="#4A2C1A" stroke-width="1.5"/>
    <circle cx="410" cy="40" r="3" fill="#007A33"/>

    <!-- RIGHT JUZ CARTOUCHE -->
    <path d="M 1200 16 L 800 16 Q 780 16 770 40 Q 780 64 800 64 L 1200 64 Z" fill="url(#cartoucheFill)" stroke="#4A2C1A" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M 1200 21 L 804 21 Q 790 21 782 40 Q 790 59 804 59 L 1200 59 Z" fill="none" stroke="url(#goldOuter)" stroke-width="3"/>
    <path d="M 1200 25 L 810 25 Q 800 25 795 40 Q 800 55 810 55 L 1200 55 Z" fill="none" stroke="#4A2C1A" stroke-width="1.5"/>
    <circle cx="790" cy="40" r="3" fill="#007A33"/>

    <!-- Center Bridge Decoration -->
    <path d="M 520 40 L 590 38 L 600 20 L 610 38 L 680 40 L 610 42 L 600 60 L 590 42 Z" fill="#007A33" stroke="url(#goldOuter)" stroke-width="1.5"/>
    <circle cx="600" cy="40" r="5" fill="#FDFCF9" stroke="#4A2C1A" stroke-width="1.5"/>
    <circle cx="600" cy="40" r="1.5" fill="#4A2C1A"/>

</svg>
